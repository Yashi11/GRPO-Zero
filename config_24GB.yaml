model:
  pretrained_model_path: "deepseek-ai/deepseek-vl2-tiny"
  device: "cuda"
  dtype: "bfloat16"
data:
  path: "/home/yashashvi/Desktop/yashi_personal/with_summaries_deduplicated.csv"
  test_size: 128
training:
  random_seed: 1337
  max_prompt_len: 256
  max_gen_len: 512
  max_steps: 50  # Limit training to 50 steps for testing
  batch_size: 8  # Reduced due to image processing overhead
  num_questions_per_batch: 2
  micro_batch_size: 1
  max_grad_norm: 1.0
  learning_rate: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
  ckpt_dir: "ckpt"
  log_dir: "logs"
  skip_unfinished_episodes: false
  ckpt_save_interval: 100
  eval_interval: 10
  memory_efficient_adamw: true